<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stub</title>
<script>try{const t=localStorage.getItem("stub-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2ee" media="(prefers-color-scheme: light)">
<style>
:root{
  color-scheme:light;
  --page:#f2f2ee;--card:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#6f6d68;--line:#e1e0d9;--track:#ebeae5;
  --accent:#2a78d6;--accent-ink:#fff;--good:#006300;--good-bg:#e3f3e3;--bad:#c62f2f;--bad-bg:#fbe6e6;--warn:#8a5a00;
  --ring:rgba(11,11,11,.10);--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  /* chart categories (fixed hue per category, validated palette) */
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948;--c0:#a3a19a;
  --seg-spent:#52514e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d;--card:#1a1a19;--text:#fff;--text2:#c3c2b7;--muted:#9a988f;--line:#2c2c2a;--track:#2c2c2a;
    --accent:#3987e5;--good:#3fc23f;--good-bg:#173017;--bad:#ef6b6b;--bad-bg:#3a1b1b;--warn:#f0b13c;
    --ring:rgba(255,255,255,.10);--shadow:none;
    --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--c0:#6e6c66;
    --seg-spent:#c3c2b7;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --page:#0d0d0d;--card:#1a1a19;--text:#fff;--text2:#c3c2b7;--muted:#9a988f;--line:#2c2c2a;--track:#2c2c2a;
    --accent:#3987e5;--good:#3fc23f;--good-bg:#173017;--bad:#ef6b6b;--bad-bg:#3a1b1b;--warn:#f0b13c;
    --ring:rgba(255,255,255,.10);--shadow:none;
    --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--c0:#6e6c66;
    --seg-spent:#c3c2b7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--text)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}
.top{position:sticky;top:0;z-index:10;background:var(--page);padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;font-weight:700;flex:1}
.sync-dot{font-size:12px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:0 12px 72px}
.card{background:var(--card);border:1px solid var(--ring);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card-h h2{font-size:16px;font-weight:650}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
.muted{color:var(--muted)}.t2{color:var(--text2)}.small{font-size:13px}.tiny{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
input,select,button,textarea{font:inherit;color:var(--text)}
input,select{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;font-size:16px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--track);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.5}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--track)}
.hidden{display:none!important}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:550}
label.f input,label.f select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* hero */
.period{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:14px}
.period b{font-size:14px}
.hero-l{font-size:13px;color:var(--text2);font-weight:550}
.hero-v{font-size:40px;font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.hero-sub{font-size:13px;color:var(--text2)}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track);margin:16px 0 10px;gap:2px}
.stackbar>i{display:block;height:100%;min-width:0}
.stackbar>i:first-child{border-radius:7px 0 0 7px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.goal{background:transparent;border:2px dashed var(--good)}
.sw.left{background:var(--track);border:1px solid var(--line)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.chip{background:var(--page);border-radius:12px;padding:10px}
.chip .l{font-size:11.5px;color:var(--muted);font-weight:550}
.chip .v{font-size:16px;font-weight:700;margin-top:2px}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;border-radius:20px;padding:3px 8px}
.status.ok{background:var(--good-bg);color:var(--good)}
.status.over{background:var(--bad-bg);color:var(--bad)}
.status.warn{background:var(--track);color:var(--warn)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:4px}

/* donut */
.donut-wrap{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:1fr}.donut-box{justify-self:center}}
.donut-box{position:relative;width:170px;height:170px}
.donut-box svg{width:170px;height:170px;display:block}
.donut-box path{cursor:pointer;transition:opacity .15s}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c b{font-size:20px;display:block}
.donut-c span{font-size:11.5px;color:var(--muted)}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-row{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;font-size:13.5px;padding:5px 6px;border-radius:8px;cursor:default}
.cat-row.hl{background:var(--track)}
.cat-row .pct{color:var(--muted);font-size:12px;width:36px;text-align:right}
.cat-row .amt{font-weight:600;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:50;background:var(--text);color:var(--card);font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* list rows (transactions, bills) */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.item .meta select{padding:2px 6px;font-size:12.5px;border-radius:8px;background:var(--page);max-width:150px}
.item .amt{font-weight:650;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .amt.in{color:var(--good)}
.item .acts{display:flex;justify-content:flex-end;margin-top:2px}
.item .acts .icon-btn{width:32px;height:32px}
/* swipe a purchase left to reveal "Leave out" and "Delete" */
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.list>.swipe:first-child{border-top:0}
.swipe .item{border-top:0;background:var(--card);position:relative;z-index:1;touch-action:pan-y;transition:transform .2s ease}
.swipe.dragging .item{transition:none}
.swipe-acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.swipe-acts button{width:84px;border:0;color:#fff;font:inherit;font-size:12px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.swipe-acts button svg{width:20px;height:20px}
.swipe-acts .sa-ex{background:#6f6d68}
.swipe-acts .sa-del{background:var(--bad)}
.item.excluded .name,.item.excluded .amt{opacity:.5}
.item.excluded .amt{text-decoration:line-through}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 4px;font:inherit;font-weight:600;cursor:pointer;color:var(--text);text-align:left}
.sheet .opt:first-of-type{border-top:0}
.sheet .opt svg{width:20px;height:20px;flex:none}
.sheet .opt.danger{color:var(--bad)}
.badge{font-size:11px;font-weight:650;border-radius:6px;padding:1px 6px;background:var(--track);color:var(--text2)}
.day-h{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;flex:none}
.logo>svg{width:21px;height:21px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px;opacity:0}
.logo.has-logo img{opacity:1}
.logo.in{background:var(--good-bg);color:var(--good)}
.logo.si i{width:22px;height:22px;display:block;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--ring);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;max-width:120px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}
@media (min-width:820px){
  body{padding-bottom:40px}
  .tabbar{position:sticky;top:0;bottom:auto;border:0;border-bottom:1px solid var(--ring);justify-content:center;gap:8px;padding:6px}
  .tabbar button{flex-direction:row;gap:8px;font-size:14px;padding:8px 14px;max-width:none;flex:none}
  .tabbar button svg{width:20px;height:20px}
  .top{position:static}
}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center}
@media (min-width:820px){.fab{bottom:28px}}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:18px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:650;cursor:pointer;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* history */
.hbars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:12px}
.hbars i{flex:1;min-width:6px;border-radius:4px 4px 0 0;background:var(--c3);display:block}
.hbars i.neg{background:var(--c8)}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg4 button{padding:9px 2px;font-size:14px}
.vchart{position:relative;display:flex;align-items:flex-end;gap:8px;height:136px;margin-top:6px}
.vchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vchart .b{display:block;width:100%;max-width:40px;border-radius:4px 4px 0 0;background:var(--c1)}
.vchart .b.now{background:repeating-linear-gradient(135deg,var(--c1) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--c1)}
.vchart .vl{font-size:11px;font-weight:650;margin-bottom:3px;white-space:nowrap}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);z-index:1;pointer-events:none}
.avgline span{position:absolute;left:0;top:-17px;font-size:11px;color:var(--muted);background:var(--card);padding:0 4px 0 0}
.xrow{display:flex;gap:8px;margin-top:5px;border-top:1px solid var(--line);padding-top:5px}
.xrow span{flex:1;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
.trow{display:grid;grid-template-columns:10px minmax(0,1fr) 84px 92px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;color:var(--muted);font-weight:650}
td.n,th.n{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-size:14px}
.toast.on{opacity:.96}
details summary{cursor:pointer}
html{overscroll-behavior-y:contain}

/* home: big "spending money" bar with a smaller "whole paycheck" bar (tap to swap) */
.bars{display:flex;flex-direction:column;gap:12px;margin:16px 0 4px;cursor:pointer}
.bar-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text2);font-weight:550}
.bar-blk .stackbar{position:relative;margin:5px 0 6px;height:6px;border-radius:3px}
.bar-blk.big .stackbar{height:16px;border-radius:8px}
.bar-blk:not(.big) .bar-h,.bar-blk:not(.big) .legend{font-size:11.5px;color:var(--muted)}
.stackbar>i{transition:width .4s ease}
.stackbar .pace{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--text);opacity:.6}

/* settings menu */
.set-gh{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 6px 6px}
.set-gh:first-child{margin-top:4px}
.set-group{background:var(--card);border:1px solid var(--ring);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px 10px 14px;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.set-row:first-child{border-top:0}
.set-row:active{background:var(--track)}
.set-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.set-ic svg{width:17px;height:17px}
.set-row .t{flex:1;font-weight:600;min-width:0}
.set-row .v{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.set-row .chev{color:var(--muted);display:grid;opacity:.7}
.sub-back{display:inline-flex;align-items:center;gap:2px;margin:0 0 6px -6px}
input.switch{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);border:0;padding:0;margin:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
input.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.switch:checked{background:var(--good)}
input.switch:checked::after{transform:translateX(18px)}

/* Android app (full screen): our own status bar with the time and battery, around the camera cutout */
.sbar{display:none}
html.apk .top{padding-top:calc(max(28px,env(safe-area-inset-top)) + 4px)}
html.apk .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:max(28px,env(safe-area-inset-top));align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
#bat{display:inline-flex;align-items:center;gap:5px}
#bat svg{width:24px;height:13px}

/* tab bar: each tab has its own color and glows when it's the one you're on */
.tabbar button .ti{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;transition:background .25s}
.tabbar button.on{color:var(--tc)}
.tabbar button.on .ti{background:color-mix(in srgb,var(--tc) 20%,transparent)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--tc) 70%,transparent));animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.7) rotate(-8deg)}100%{transform:none}}
@media (min-width:820px){.tabbar button .ti{width:auto;height:auto;background:none!important}}
.fab{background:var(--tabc,var(--accent));transition:background .3s}
.sheet{position:relative}
.sheet-x{position:absolute;top:10px;right:10px}
/* first-run intro + help */
.intro{text-align:center;padding:8px 4px 0}
.intro h2{font-size:21px;margin:14px 0 8px}
.intro-art{width:84px;height:84px;border-radius:22px;margin:6px auto 0;display:block}
.intro-art.ic{display:grid;place-items:center;color:#fff;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.intro-art.ic svg{width:42px;height:42px}
.intro .small{min-height:96px;line-height:1.55}
.intro-tabs{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:4px}
.intro-tabs div{display:flex;gap:10px;align-items:baseline}
.intro-tabs b{width:76px;flex:none}
.dots{display:flex;justify-content:center;gap:6px;margin:18px 0 14px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .25s}
.dots i.on{width:22px;background:var(--accent)}
details.help{border-top:1px solid var(--line);padding:2px 0}
details.help:first-of-type{border-top:0}
details.help summary{font-weight:600;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
details.help summary::after{content:'+';color:var(--muted);font-weight:700}
details.help[open] summary::after{content:'−'}
details.help>div{padding:0 0 12px}

/* screen change + pull to refresh */
#app.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptr{position:fixed;top:0;left:50%;z-index:30;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--accent);transform:translateY(-48px);opacity:0;pointer-events:none}
.ptr.back{transition:transform .25s,opacity .25s}
.ptr svg{width:20px;height:20px}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#app.enter{animation:none}.stackbar>i{transition:none}}
</style>
</head>
<body>

let SI=null; // Simple Icons index: normalized brand name -> [slug, hex color]
function loadSimpleIcons(){
  fetch(SI_CDN+'/data/simple-icons.json').then(r=>r.json()).then(list=>{

    for(const i of list)for(const n of [i.title,...((i.aliases&&i.aliases.aka)||[])]){const k=normName(n);if(k.length>=3&&!m.has(k))m.set(k,[i.slug,i.hex]);}

function siMatch(desc){
  if(!SI)return null;const w=nameWords(desc);

    if(n===1&&(k.length<4||NO_GUESS.test(k)))continue;
    if(SI.has(k))return SI.get(k);

// Free company-name -> website lookup, once per store; the answer is remembered (and synced)
const lookupQ=new Map();let looking=false,lookupFound=false;

async function runLookups(){
  looking=true;
  while(lookupQ.size){
    const mk=lookupQ.keys().next().value;lookupQ.delete(mk);
    const w=mk.split(' ');let res={none:1};
    try{
      // only accept a company whose name or website really is this store's name
      const q1=normName(w[0]),q2=normName(w.slice(0,2).join(''));
      const ok=c=>{const n=normName(c.name),d=normName(String(c.domain).split('.')[0]);
        return n===q1||n===q2||d===q1||d===q2||(q2.length>=8&&q2!==q1&&n.startsWith(q2));};

      for(const q of [w.slice(0,2).join(' '),...(w.length>1&&w[0].length>=5?[w[0]]:[])]){

        if(hit){res={d:hit.domain};break;}
      }
    }catch(e){res=null;} // offline: try again another time
    if(res){S.logoCache[mk]=res;if(res.d){lookupFound=true;refreshLogos(mk);}}

function logoHTML(desc,cat,income){
  const mk=merchantKey(desc),attrs=`data-lk="${esc(desc)}" data-lc="${esc(cat)}" data-li="${income?1:''}"`;

  const base=(inner,extra='')=>`<span class="logo ${income?'in':''}" ${attrs} ${income?'':`style="background:${catColor(cat)}"`}>${lucide(CAT_ICON[cat]||(income?'coins':'dollar'))}${extra}${inner||''}</span>`;
  let d=brandDomain(desc);

    return `<span class="logo si" ${attrs} style="background:#${h}"><i style="background:${lum>180?'#111':'#fff'};-webkit-mask-image:url(${SI_CDN}/icons/${si[0]}.svg);mask-image:url(${SI_CDN}/icons/${si[0]}.svg)"></i></span>`;
  }

function donutCard(p){
  // spending by category + recurring, in fixed category order so each keeps its color
  const parts={...p.byCat};if(p.billsTotal)parts['Recurring']=p.billsTotal;
  const order=Object.keys(CAT_SLOT).sort((a,b)=>CAT_SLOT[a]-CAT_SLOT[b]);
  const slices=[];let other=0;
  for(const c of order)if(parts[c])slices.push([c,parts[c],catColor(c)]);
  for(const [c,v] of Object.entries(parts))if(!CAT_SLOT[c])other+=v;
  if(other)slices.push(['Other',other,'var(--c0)']);
  const total=slices.reduce((a,s)=>a+s[1],0);
  if(!total)return `<div class="card"><div class="card-h"><h2>Where it went</h2></div><p class="small muted">No spending yet this period.</p></div>`;
  const R=80,r=54,cx=85,cy=85,gap=slices.length>1?0.012:0;let a0=-Math.PI/2;
  const arc=(a1,a2)=>{const big=a2-a1>Math.PI?1:0,p=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
    const [x1,y1]=p(R,a1),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,a1);
    return `M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z`;};
  const paths=slices.map(([c,v,col],k)=>{const span=v/total*Math.PI*2;
    const a1=a0+(slices.length>1?gap:0),a2=a0+span-(slices.length>1?gap:0);a0+=span;
    const d=slices.length===1?`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`:arc(a1,Math.max(a1+.001,a2));
    return `<path d="${d}" fill="${col}" stroke="var(--card)" stroke-width="2" data-k="${k}"></path>`;}).join('');
  return `<div class="card"><div class="card-h"><h2>Where it went</h2><span class="small muted">${$m(total)}</span></div>
    <div class="donut-wrap">
      <div class="donut-box"><svg viewBox="0 0 170 170" role="img" aria-label="Spending by category">${paths}</svg>
        <div class="donut-c"><div><b>${$r(total)}</b><span>${p.billsTotal?'spent + recurring':'total spent'}</span></div></div></div>
      <div class="cat-list">${slices.map(([c,v,col],k)=>`<div class="cat-row" data-k="${k}"><i class="sw" style="background:${col}"></i><span>${esc(c)}</span><span class="pct">${Math.round(v/total*100)}%</span><span class="amt">${$m(v)}</span></div>`).join('')}</div>
    </div></div>`;
}
function bindDonut(){

  const rows=[...document.querySelectorAll('.cat-row')],paths=[...document.querySelectorAll('.donut-box path')];
  const hl=k=>{paths.forEach(p=>p.style.opacity=k==null||p.dataset.k===k?1:.35);rows.forEach(r=>r.classList.toggle('hl',r.dataset.k===k));};

}

// swipe a row left to show its buttons; only one row open at a time
let swOpen=null;
function closeSwipe(){if(swOpen){swOpen.classList.remove('open');swOpen.querySelector('.item').style.transform='';swOpen=null;}}
function bindSwipe(row){
  const front=row.querySelector('.item'),W=168;let x0=null,y0=0,dx=0,dragging=false,justSwiped=false;
  front.addEventListener('pointerdown',e=>{if(e.target.closest('select,button'))return;x0=e.clientX;y0=e.clientY;dx=0;dragging=false;});
  front.addEventListener('pointermove',e=>{
    if(x0==null)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(!dragging){if(Math.abs(mx)<8)return;if(Math.abs(my)>Math.abs(mx)){x0=null;return;}dragging=true;row.classList.add('dragging');if(swOpen&&swOpen!==row)closeSwipe();try{front.setPointerCapture(e.pointerId);}catch(_){}}
    const base=row.classList.contains('open')?-W:0;dx=Math.max(-W-20,Math.min(0,base+mx));front.style.transform=`translateX(${dx}px)`;
  });
  const end=()=>{if(x0==null)return;x0=null;row.classList.remove('dragging');if(!dragging)return;
    justSwiped=true;setTimeout(()=>justSwiped=false,350); // the browser sends a click right after a swipe; ignore it
    if(dx<-W/2){if(!row.classList.contains('open'))buzz();row.classList.add('open');front.style.transform=`translateX(${-W}px)`;swOpen=row;}else{row.classList.remove('open');front.style.transform='';if(swOpen===row)swOpen=null;}};
  front.addEventListener('pointerup',end);front.addEventListener('pointercancel',end);
  front.addEventListener('click',e=>{
    if(justSwiped){e.preventDefault();e.stopPropagation();justSwiped=false;return;}
    if(row.classList.contains('open')&&!e.target.closest('button,select')){e.preventDefault();closeSwipe();} // tap the row to close it
  },true);
}
document.addEventListener('pointerdown',e=>{if(swOpen&&!swOpen.contains(e.target))closeSwipe();});
function bindTxRows(){
  swOpen=null;
  document.querySelectorAll('.swipe').forEach(bindSwipe);
  document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>txMenu(b.dataset.more));
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{closeSwipe();toggleExclude(b.dataset.ex);});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{closeSwipe();confirmDelete(b.dataset.del);});
  document.querySelectorAll('[data-cat]').forEach(s=>s.onchange=()=>{
    const t=S.tx.find(x=>x.id===s.dataset.cat);t.cat=s.value;
    const k=merchantKey(t.desc);
    if(k){S.rules[k]=s.value;let n=0;for(const o of S.tx)if(o!==t&&o.cat==='Uncategorized'&&merchantKey(o.desc)===k){o.cat=s.value;n++;}
      if(n)toast(`Also set ${n} other "${k}" transaction${n>1?'s':''}`);}
    save();render();
  });
}
bind.tx=()=>{

// ---------- CSV import ----------
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[];}
    else f+=c;}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function parseDate(s){
  s=String(s).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/)){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  const d=new Date(s);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return null;
}
function parseAmt(s){
  s=String(s??'').trim();if(!s)return null;
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s);
  const n=parseFloat(s.replace(/[^0-9.]/g,''));
  return isNaN(n)?null:(neg?-n:n);
}
// ---------- automatic bank sync (your bank's alert emails, read by your Google Apps Script) ----------
let syncing=false,syncMsg='',unreadAlerts=[];
// ---------- talking to your Google Apps Script (data, bank alerts, emails) ----------
// Every request carries your secret key; without it the script answers nothing.
// Your server is your own copy of Stub's Apps Script (see the README). Its address and your key are saved on this device only.
const SERVER_STORE='stub-server',KEY_STORE='stub-key';
const getServer=()=>{try{return localStorage.getItem(SERVER_STORE)||'';}catch(e){return '';}};
const getKey=()=>{try{return localStorage.getItem(KEY_STORE)||'';}catch(e){return '';}};
const connected=()=>!!(getKey()&&getServer());
async function callServer(fn,...args){
  const r=await fetch(getServer(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:getKey(),fn,args})});
  const d=await r.json();
  if(d.error==='bad-key'){try{localStorage.removeItem(KEY_STORE);}catch(e){}keyError='That key wasn\u2019t accepted.';render();throw new Error('Key not accepted');}
  if(d.error)throw new Error(d.error);
  return d.ok;
}

function bindImport(){
  if(!document.getElementById('csvf'))return;
  document.getElementById('csvf').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const rows=parseCSV(await f.text());
    // some banks put junk lines before the header: find first row that has a date-ish header
    let h=rows.findIndex(r=>r.some(c=>/date/i.test(c)));if(h<0)h=0;
    const headers=rows[h].map(x=>x.trim()),data=rows.slice(h+1);
    csv={headers,rows:data,map:{
      date:guess(headers,['posting date','post date','transaction date','date']),
      desc:guess(headers,['description','payee','merchant','name','memo','details']),
      amt:guess(headers,['amount']),deb:guess(headers,['debit','withdrawal']),cred:guess(headers,['credit','deposit'])}};
    render();
  };
  const btn=document.getElementById('doImp');if(!btn)return;
  btn.onclick=()=>{
    const g=id=>+document.getElementById(id).value;
    const di=g('mDate'),de=g('mDesc'),am=g('mAmt'),db=g('mDeb'),cr=g('mCred'),sign=document.getElementById('mSign').value;
    if(di<0||(am<0&&db<0&&cr<0)){toast('Pick a Date and an Amount (or Debit/Credit) column');return;}
    const seen=new Set(S.tx.map(t=>t.date+'|'+t.amount.toFixed(2)+'|'+t.type+'|'+t.desc.toLowerCase()));
    let added=0,dup=0,bad=0;
    for(const r of csv.rows){
      const date=parseDate(r[di]);let v=null;
      if(am>=0&&parseAmt(r[am])!==null){v=parseAmt(r[am]);if(sign==='pos')v=-v;}
      else{const d=db>=0?parseAmt(r[db]):null,c=cr>=0?parseAmt(r[cr]):null;
        if(d)v=-Math.abs(d);else if(c)v=Math.abs(c);}
      if(!date||v===null||v===0){bad++;continue;}
      const desc=(de>=0?r[de]:'').trim()||'Transaction';
      const type=v<0?'expense':'income',amount=Math.abs(v);
      const k=date+'|'+amount.toFixed(2)+'|'+type+'|'+desc.toLowerCase();
      if(seen.has(k)){dup++;continue;}seen.add(k);
      const nt={id:uid(),date,desc,amount,type};nt.cat=guessCat(desc,type,nt);
      S.tx.push(nt);added++;
    }

bind.settings=()=>{

    S.settingsAt=Date.now();let n=0;
    if(S.settings.payMode==='auto')for(const t of S.tx)if(t.cat!=='Paycheck'&&!S.rules[merchantKey(t.desc)]&&isPayDeposit(t)){t.cat='Paycheck';n++;}
    save();viewIdx=pIndex(todayISO());toast(n?`Saved — found ${n} paycheck${n>1?'s':''}`:'Saved');
  })));
  document.querySelectorAll('[data-aname]').forEach(i=>i.onchange=()=>{S.settings.acctNames=S.settings.acctNames||{};
    if(i.value.trim())S.settings.acctNames[i.dataset.aname]=i.value.trim();else delete S.settings.acctNames[i.dataset.aname];S.settingsAt=Date.now();save();toast('Saved');});

    if(a.length!==4||!n){toast('Enter 4 digits and a name');return;}S.settings.acctNames=S.settings.acctNames||{};S.settings.acctNames[a]=n;S.settingsAt=Date.now();save();render();});

  on('exp',b=>b.onclick=()=>{

    a.download=`budget-backup-${todayISO()}.json`;a.click();
  });

    const f=e.target.files[0];if(!f)return;

};

function setTheme(t){
  if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{t==='auto'?localStorage.removeItem('stub-theme'):localStorage.setItem('stub-theme',t);}catch(e){}
  const b=document.getElementById('themeBtn');b.innerHTML=themeIcon[t];b.title=({auto:'Matching your phone',light:'Light mode',dark:'Dark mode'})[t];
}
setTheme(document.documentElement.dataset.theme||'auto');
document.getElementById('themeBtn').onclick=()=>{const t=THEMES[(THEMES.indexOf(document.documentElement.dataset.theme||'auto')+1)%3];setTheme(t);toast(document.getElementById('themeBtn').title);};
render();
maybeIntro();
// long-press the app icon → "Add purchase"
if(new URLSearchParams(location.search).get('add')&&connected()){document.getElementById('fab').click();history.replaceState(null,'',location.pathname);}
// keep the app's screens on this device so it opens instantly (and offline)
// and pick up new versions: check whenever the app comes back to the screen, then reload into the update
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloading){reloading=true;location.reload();}});
  navigator.serviceWorker.register('sw.js').then(reg=>document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{});})).catch(()=>{});
}
loadSimpleIcons();
// get the latest from your other devices first, then check for new bank alerts
const refresh=async()=>{if(connected())await pullRemote();autoSync();};
refresh();
setInterval(refresh,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
// Inside the Android app the phone's status bar is hidden, so show our own time and battery
(()=>{
  let apk=false;
  try{if(document.referrer.startsWith('android-app://io.github.picovrfbt.stub'))sessionStorage.setItem('stub-apk','1');apk=!!sessionStorage.getItem('stub-apk');}catch(e){}
  if(!apk&&!matchMedia('(display-mode: fullscreen)').matches)return;
  document.documentElement.classList.add('apk');
  const clk=document.getElementById('clk'),bat=document.getElementById('bat');
  const tick=()=>{clk.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M$/i,'');};
  tick();setInterval(tick,10000);
  if(!navigator.getBattery)return;
  navigator.getBattery().then(b=>{
    const draw=()=>{const p=Math.round(b.level*100),low=p<=15&&!b.charging,c=b.charging?'var(--good)':low?'var(--bad)':'currentColor';
      bat.innerHTML=`${p}%<svg viewBox="0 0 26 14" fill="none"><rect x=".75" y=".75" width="21.5" height="12.5" rx="3.2" stroke="currentColor" stroke-width="1.5" opacity=".55"/><rect x="23.5" y="4.5" width="2" height="5" rx="1" fill="currentColor" opacity=".55"/><rect x="2.75" y="2.75" width="${Math.max(1.5,17.5*b.level)}" height="8.5" rx="1.6" fill="${c}"/>${b.charging?'<path d="M13 2.5 9 7.6h3.2L11 11.5l4-5.1h-3.2z" fill="var(--page)"/>':''}</svg>`;};
    draw();b.onlevelchange=b.onchargingchange=draw;
  }).catch(()=>{});
})();
// pull down from the top of any screen to get the latest and check for new bank alerts
(()=>{
  const ind=document.getElementById('ptr'),PULL=70;let y0=null,dy=0,busy=false;
  const show=(y,o)=>{ind.style.transform=`translateY(${y}px)`;ind.style.opacity=o;};
  addEventListener('touchstart',e=>{y0=!busy&&scrollY<=0&&connected()&&!document.getElementById('sheetRoot').innerHTML?e.touches[0].clientY:null;dy=0;ind.classList.remove('back');},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=(e.touches[0].clientY-y0)*.5;if(dy<=0)return show(-48,0);
    show(Math.min(dy,PULL+20)-48+12,Math.min(1,dy/PULL));ind.querySelector('svg').style.transform=`rotate(${dy*4}deg)`;},{passive:true});
  addEventListener('touchend',async()=>{if(y0==null)return;y0=null;ind.classList.add('back');
    if(dy<PULL)return show(-48,0);
    busy=true;buzz();show(PULL-36,1);ind.classList.add('spin');
    try{if(connected())await pullRemote();await syncBank(false);}catch(e){}
    ind.classList.remove('spin');show(-48,0);busy=false;render();});
})();
</script>
</body>
</html>
